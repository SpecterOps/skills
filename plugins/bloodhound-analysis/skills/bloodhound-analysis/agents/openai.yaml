interface:
  display_name: "BloodHound Analysis"
  short_description: "Check BloodHound health, inspect paths, and triage graph exposure."
  icon_small: "./assets/icon.svg"
  icon_large: "./assets/icon.png"
  brand_color: "#991B1B"
  default_prompt: "Use $bloodhound-analysis to check BloodHound connectivity, inspect shortest paths, or triage AD/Azure/OpenGraph/SCIM exposure before routing to a specialist skill."

dependencies:
  tools:
    - type: "mcp"
      value: "bloodhound_mcp"
      description: "BloodHound CE MCP server for graph analysis and Cypher queries"
      transport: "stdio"

policy:
  allow_implicit_invocation: true
