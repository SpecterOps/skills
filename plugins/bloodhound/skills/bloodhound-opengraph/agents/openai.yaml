interface:
  display_name: "BloodHound OpenGraph"
  short_description: "Design BloodHound OpenGraph schemas, nodes, edges, ingestors, and extension workflows."
  icon_small: ./assets/icon.svg
  icon_large: ./assets/icon.png
  brand_color: "#7F1D1D"
  default_prompt: "Use $bloodhound-opengraph to design or review BloodHound OpenGraph nodes, relationships, schemas, ingestors, extension management, SCIM bridges, or custom collector behavior."

dependencies:
  tools:
    - type: "mcp"
      value: "bloodhound_mcp"
      description: "BloodHound CE MCP server with custom_nodes and Cypher support"
      transport: "stdio"

policy:
  allow_implicit_invocation: true
