interface:
  display_name: "Course Wiki Stage 1 Scaffold"
  short_description: "Bootstrap and verify the stage-1 course wiki shell."
  icon_small: ./assets/icon.svg
  icon_large: ./assets/icon.png
  brand_color: '#00B36B'
  default_prompt: "Use $course-wiki-stage1-scaffold to bootstrap a new course wiki from the wiki-course-atd-instructor scaffold and verify the shell in local or deployed browser checks."

dependencies:
  tools:
    - type: "mcp"
      value: "playwright"
      description: "Playwright MCP browser automation"

policy:
  allow_implicit_invocation: true
