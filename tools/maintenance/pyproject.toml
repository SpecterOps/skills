[project]
name = "specterops-skills-maintenance"
version = "0.1.0"
description = "Local maintenance tooling for the SpecterOps skills repository"
requires-python = ">=3.13,<3.14"
dependencies = [
  "jsonschema==4.25.1",
  "markdown-it-py==4.0.0",
  "PyYAML==6.0.3",
]

[dependency-groups]
dev = [
  "pytest==8.4.2",
  "ruff==0.12.12",
]

[tool.repo-maintenance]
uv-version = "0.12.3"
bootstrap-environment = ".bootstrap-venv"

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
testpaths = ["tools/repo_maintenance/tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
